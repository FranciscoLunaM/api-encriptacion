name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: creating image from docker
      run: |
        docker build -t . ${{vars.DOCKER_HUB_USERNAME}}/apiencriptacion:latest


    - name: logging and Push To Docker Hub
      run: |
        docker login -u franciscoeluna -p ${{ secrets.DOCKER_HUB_TOKEN }}
        docker push ${{vars.DOCKER_HUB_USERNAME}}/apiencriptacion:latest
